name: Deploy mini PC

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: maple-craft-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ vars.ENABLE_DEPLOY == 'true' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $path='${{ vars.DEPLOY_PATH }}'; if ([string]::IsNullOrWhiteSpace($path)) { $path='C:\home\maple\app' }; if (-not (Test-Path (Join-Path $path '.git'))) { New-Item -ItemType Directory -Force -Path $path | Out-Null; git clone git@github.com:chl4890620123-collab/maple.git $path }; Set-Location $path; git fetch origin main; git reset --hard origin/main; & '.\deploy\scripts\deploy.ps1' -AppPort '${{ vars.APP_PORT || '18080' }}' -DefaultFeeRate '${{ vars.DEFAULT_FEE_RATE || '0.05' }}'"
