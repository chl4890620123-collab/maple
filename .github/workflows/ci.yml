name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: SQLite regression tests
        env:
          DB_ENGINE: sqlite
        run: PYTHONPATH=. pytest -q
      - name: Docker build
        run: docker build --platform linux/amd64 -t maple-craft-analytics:ci .

  mariadb-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: maple_craft
          MARIADB_USER: maple_app
          MARIADB_PASSWORD: maple_ci_password
          MARIADB_ROOT_PASSWORD: maple_ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: MariaDB integration regression tests
        env:
          DB_ENGINE: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: maple_craft
          DB_USER: maple_app
          DB_PASSWORD: maple_ci_password
        run: PYTHONPATH=. pytest -q
