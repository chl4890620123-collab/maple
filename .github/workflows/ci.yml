name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate UTF-8, JSON and tracked artifacts
        run: |
          python scripts/check_text_integrity.py
          ignored="$(git ls-files -ci --exclude-standard)"
          if [ -n "$ignored" ]; then
            echo "Tracked files are ignored by .gitignore:"
            echo "$ignored"
            exit 1
          fi
          node --check app/static/app.js
          node --check app/static/features.js
          test -s app/static/features.css
          grep -q 'id="sortMode"' app/static/index.html
          grep -q 'id="favoritesOnly"' app/static/index.html
          grep -q '/features.js' app/static/index.html
          grep -q '/features.css' app/static/index.html
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: SQLite regression tests
        env:
          DB_ENGINE: sqlite
        run: PYTHONPATH=. pytest -q
      - name: Validate Compose
        env:
          DB_PASSWORD: ci_maple_password
          DB_ROOT_PASSWORD: ci_maple_root_password
          ADMIN_TOKEN: ci_admin_token
        run: docker compose config >/dev/null
      - name: Docker build
        run: docker build --platform linux/amd64 -t maple-craft-analytics:ci .
      - name: Docker runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name maple-ci-smoke \
            -e DB_ENGINE=sqlite \
            -e DB_PATH=/tmp/maple-ci.db \
            -p 127.0.0.1:18081:8000 \
            maple-craft-analytics:ci
          cleanup() { docker rm -f maple-ci-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if python - <<'PY'
import json
import urllib.request

try:
    with urllib.request.urlopen('http://127.0.0.1:18081/api/health', timeout=2) as response:
        assert response.status == 200
    with urllib.request.urlopen('http://127.0.0.1:18081/api/meister/meta', timeout=2) as response:
        meta = json.load(response)
    assert meta['total_recipe_count'] >= 50
    assert len(meta['categories']) == 5
    with urllib.request.urlopen('http://127.0.0.1:18081/', timeout=2) as response:
        html = response.read().decode('utf-8')
    assert 'id="sortMode"' in html
    assert 'id="favoritesOnly"' in html
    assert '/features.js' in html
    with urllib.request.urlopen('http://127.0.0.1:18081/features.js', timeout=2) as response:
        js = response.read().decode('utf-8')
    assert 'FAVORITES_KEY' in js
    assert 'renderCalculationsEnhanced' in js
    with urllib.request.urlopen('http://127.0.0.1:18081/features.css', timeout=2) as response:
        css = response.read().decode('utf-8')
    assert '.favorite-button' in css
except Exception:
    raise SystemExit(1)
PY
            then
              exit 0
            fi
            sleep 2
          done
          docker logs maple-ci-smoke
          exit 1

  mariadb-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: maple_craft
          MARIADB_USER: maple_app
          MARIADB_PASSWORD: maple_ci_password
          MARIADB_ROOT_PASSWORD: maple_ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: MariaDB integration regression tests
        env:
          DB_ENGINE: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: maple_craft
          DB_USER: maple_app
          DB_PASSWORD: maple_ci_password
        run: PYTHONPATH=. pytest -q
