name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate UTF-8, JSON and tracked artifacts
        run: |
          python scripts/check_text_integrity.py
          ignored="$(git ls-files -ci --exclude-standard)"
          if [ -n "$ignored" ]; then
            echo "Tracked files are ignored by .gitignore:"
            echo "$ignored"
            exit 1
          fi
          node --check app/static/app.js
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: SQLite regression tests
        env:
          DB_ENGINE: sqlite
        run: PYTHONPATH=. pytest -q
      - name: Validate Compose
        env:
          DB_PASSWORD: ci_maple_password
          DB_ROOT_PASSWORD: ci_maple_root_password
          ADMIN_TOKEN: ci_admin_token
        run: docker compose config >/dev/null
      - name: Docker build
        run: docker build --platform linux/amd64 -t maple-craft-analytics:ci .

  mariadb-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: maple_craft
          MARIADB_USER: maple_app
          MARIADB_PASSWORD: maple_ci_password
          MARIADB_ROOT_PASSWORD: maple_ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: MariaDB integration regression tests
        env:
          DB_ENGINE: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: maple_craft
          DB_USER: maple_app
          DB_PASSWORD: maple_ci_password
        run: PYTHONPATH=. pytest -q
