<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Maple Craft Analytics</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">MAPLE CRAFT ANALYTICS</p>
        <h1>전문기술 제작 수익 계산기</h1>
        <p class="sub">가격만 입력하고, 제작비·수수료·예상 수익·판매 기록은 자동으로 쌓습니다.</p>
      </div>
      <div class="auth-box">
        <label>관리 토큰</label>
        <div class="inline">
          <input id="adminToken" type="password" placeholder="배포용 ADMIN_TOKEN" />
          <button id="saveToken" class="secondary">저장</button>
        </div>
      </div>
    </header>

    <nav class="tabs">
      <button data-tab="calc" class="active">전체 계산</button>
      <button data-tab="prices">가격 입력</button>
      <button data-tab="records">제작·판매 기록</button>
    </nav>

    <main>
      <section id="calc" class="tab-panel active">
        <div class="toolbar card">
          <div>
            <label>판매 수수료</label>
            <select id="feeRate">
              <option value="0.05">5% · MVP/PC방 미적용</option>
              <option value="0.03">3% · 적용</option>
            </select>
          </div>
          <div>
            <label>전문기술</label>
            <select id="professionFilter">
              <option value="">전체</option>
              <option>장비 제작</option>
              <option>장신구 제작</option>
              <option>연금술</option>
            </select>
          </div>
          <div class="grow">
            <label>검색</label>
            <input id="itemSearch" placeholder="마이스터, 비약..." />
          </div>
          <button id="refresh">다시 계산</button>
        </div>

        <div id="summaryCards" class="summary-grid"></div>
        <div class="card table-card">
          <div class="table-head">
            <div>
              <h2>제작 우선순위</h2>
              <p>예상 순이익 높은 순. 실제 제작 여부는 경매장 상황을 보고 최종 판단하세요.</p>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>#</th><th>제작품</th><th>분류</th><th>제작단가</th><th>판매가</th><th>수수료</th><th>예상수익</th><th>마진</th><th></th></tr></thead>
              <tbody id="calcRows"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="prices" class="tab-panel">
        <div class="grid-2">
          <div class="card">
            <div class="section-title"><div><h2>재료 가격</h2><p>저장할 때마다 가격 이력이 남습니다.</p></div></div>
            <div id="materialList" class="edit-list"></div>
          </div>
          <div class="card">
            <div class="section-title"><div><h2>완제품 판매가</h2><p>경매장에서 확인한 개당 판매가를 입력하세요.</p></div></div>
            <div id="itemPriceList" class="edit-list"></div>
          </div>
        </div>
      </section>

      <section id="records" class="tab-panel">
        <div id="dashCards" class="summary-grid"></div>
        <div class="grid-2">
          <div class="card">
            <h2>최근 제작</h2>
            <div id="craftList" class="record-list"></div>
          </div>
          <div class="card">
            <h2>최근 판매</h2>
            <div id="saleList" class="record-list"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="recipeDialog">
    <form method="dialog" class="dialog-card">
      <button class="dialog-close" value="cancel">×</button>
      <div id="recipeDialogBody"></div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
